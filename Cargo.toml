[workspace]
resolver = "2"
members = [
    "crates/kestrel-core",
    "crates/kestrel-ui",
    "crates/kestrel-app",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/salim77007j/kestrel"

[workspace.dependencies]
# --- internal ---
kestrel-core = { path = "crates/kestrel-core" }
kestrel-ui = { path = "crates/kestrel-ui" }

# --- engine ---
servo = "0.1.3"

# --- ui ---
egui = "0.36"
eframe = "0.36"
egui-winit = "0.36"
egui-wgpu = "0.36"
egui_glow = "0.36"
winit = "0.30.13"

# --- async / event loop ---
crossbeam-channel = "0.5"
parking_lot = "0.12"

# --- data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
percent-encoding = "2"
idna = "1"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }

# --- security / crypto ---
rustls = "0.23"
aws-lc-rs = "1"
ring = "0.17"
sha2 = "0.10"
blake3 = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"

# --- filter engine ---
aho-corasick = "1"
regex = "1"
memchr = "2"
once_cell = "1"
rayon = "1"

# --- misc ---
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
resvg = "0.45"
dirs = "6"
notify = "8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
incremental = false

# Engine crates are enormous; keep their own debug info lean so linking fits
# in CI memory budgets without disabling debuggability for our own code.
[profile.release.package."*"]
opt-level = 3
debug = false
